name: Import v2rayNG into Light speed

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import v2rayNG source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v2rayng
          git clone --recursive --depth 1 https://github.com/tavaamir6-lang/v2rayNG.git /tmp/v2rayng

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/v2rayng/. .

          # Rebrand package identity while keeping the existing Kotlin namespace stable.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("V2rayNG/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('applicationId = "com.v2ray.ang"', 'applicationId = "com.lightspeed.vpn"')
          p.write_text(s)
          PY

          # Ensure the project name and visible app branding are Light speed.
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path("V2rayNG/settings.gradle.kts"),
              Path("V2rayNG/app/src/main/res/values/strings.xml"),
          ]
          for p in files:
              if p.exists():
                  s = p.read_text()
                  s = s.replace("v2rayNG", "Light speed").replace("V2RayNG", "Light speed")
                  p.write_text(s)
          PY

          # Keep a one-time marker in the repository history and remove this bootstrap workflow
          # so it cannot loop on its own commit.
          printf 'Imported from tavaamir6-lang/v2rayNG on 2026-10-09.\n' > LIGHT_SPEED_V2RAYNG_IMPORT.md
          rm -f .github/workflows/import-v2rayng.yml

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import v2rayNG and rebrand as Light speed" || exit 0
          git push origin HEAD:main
